<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bayou Detail Co. — Book a Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bayou-green: #16302A;
    --bayou-green-deep: #0D211C;
    --brass: #C9A227;
    --brass-soft: #E3C766;
    --sand: #F3ECDA;
    --sand-dim: #D9CFAE;
    --error: #C24A3B;
    --ok: #7FA37A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bayou-green);
    background-image:
      radial-gradient(ellipse at top left, rgba(201,162,39,0.08), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(201,162,39,0.04), transparent 55%);
    color: var(--sand);
    font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: rgba(243,236,218,0.04);
    padding: 28px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(13,33,28,0.25);
    border: 1px solid rgba(243,236,218,0.06);
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0 0 8px;
    font-weight: 700;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 28px;
    line-height: 1.06;
    margin: 0 0 8px;
    color: var(--sand);
  }

  .sub {
    color: var(--sand);
    font-size: 14px;
    line-height: 1.45;
    margin: 0 0 18px;
    max-width: 60ch;
  }

  form { display: grid; gap: 14px; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: rgba(243,236,218,0.95);
    margin-bottom: 6px;
  }

  input, select {
    width: 100%;
    background: rgba(243,236,218,0.06);
    border: 1px solid rgba(243,236,218,0.18);
    border-radius: 8px;
    color: var(--bayou-green-deep);
    font-size: 15px;
    padding: 10px 12px;
    transition: box-shadow 0.12s ease, border-color 0.12s ease;
  }

  select { padding-right: 36px; }

  input::placeholder { color: rgba(13,33,28,0.32); }

  input:focus, select:focus {
    outline: none;
    border-color: var(--brass);
    box-shadow: 0 10px 28px rgba(22,48,42,0.12);
    background: rgba(243,236,218,0.09);
  }

  .field-error { font-size: 13px; color: var(--error); margin-top: 6px; min-height: 18px; }

  button[type="submit"] {
    margin-top: 6px;
    background: linear-gradient(90deg,#C9A227 0%, #E3C766 100%);
    color: var(--bayou-green-deep);
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    padding: 12px 14px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(201,162,39,0.12);
  }

  button[type="submit"]:hover { transform: translateY(-1px); box-shadow: 0 12px 36px rgba(201,162,39,0.14); }
  button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

  .status { margin-top: 14px; font-size: 14px; padding: 12px; border-radius: 8px; display: none; }
  .status.show { display: block; }
  .status.ok { background: #ecfdf5; border: 1px solid #bbf7d0; color: #065f46; }
  .status.err { background: #fff5f5; border: 1px solid #fecaca; color: #991b1b; }

  .footnote { margin-top: 20px; font-size: 13px; color: rgba(243,236,218,0.9); line-height: 1.4; }

  hr.rule { border: none; border-top: 1px solid rgba(243,236,218,0.08); margin: 24px 0 18px; }
</style>
</head>
<body>

<div class="card">
  <p class="eyebrow">Houston · Van comes to you</p>
  <h1>Book a detail</h1>
  <p class="sub">Two vans, real people, no showroom. Tell us where and when — we'll confirm the slot.</p>

  <form id="booking-form" novalidate>
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Full name" required autocomplete="name">
      <div class="field-error" id="err-name"></div>
    </div>

    <div>
      <label for="vehicle">Vehicle</label>
      <input type="text" id="vehicle" name="vehicle" placeholder="e.g. 2021 Honda CR-V, silver" required>
      <div class="field-error" id="err-vehicle"></div>
    </div>

    <div>
      <label for="zip">Zip code</label>
      <input type="text" id="zip" name="zip" inputmode="numeric" maxlength="5" required>
      <div class="field-error" id="err-zip"></div>
    </div>

    <div>
      <label for="service">Service</label>
      <select id="service" name="service" required>
        <option value="" disabled selected>Choose a service</option>
        <option>Wash & Wax</option>
        <option>Interior Deep Clean</option>
        <option>Full Detail</option>
        <option>Ceramic Coating</option>
        <option>Maintenance Plan Visit</option>
      </select>
      <div class="field-error" id="err-service"></div>
    </div>

    <div>
      <label for="time_slot">Time slot</label>
      <select id="time_slot" name="time_slot" required>
        <option value="" disabled selected>Choose a time</option>
        <option>8:00 AM – 10:00 AM</option>
        <option>10:00 AM – 12:00 PM</option>
        <option>12:00 PM – 2:00 PM</option>
        <option>2:00 PM – 4:00 PM</option>
      </select>
      <div class="field-error" id="err-time_slot"></div>
    </div>

    <button type="submit" id="submit-btn">Request booking</button>

    <div class="status" id="status"></div>
  </form>

  <hr class="rule">
  <p class="footnote">
    We currently run in Inner Loop Houston, Katy/Energy Corridor, Kingwood, and Pearland/Friendswood/League City. If your zip isn't in that range yet, we'll let you know.
  </p>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // --- Fill these in from your Supabase project settings (Project Settings > API) ---
  const SUPABASE_URL = 'https://wjobzqbwjizrbbkzuowz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_IZ0M5aE4P_BFYSGV3HeFrA_wsDyhfnE';
  // -----------------------------------------------------------------------------

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Service-area zips, pulled from June's actual job log + lead data.
  // Inner Loop, Kingwood, Katy/Energy Corridor, Pearland/Friendswood/League City.
  const SERVICE_ZIPS = new Set([
    '77005', '77006', '77007', '77008', '77019', '77024', '77025', '77027',
    '77030', '77056', '77098',            // Inner Loop
    '77339',                              // Kingwood
    '77401',                              // Bellaire / inner-adjacent
    '77450', '77494',                     // Katy / Energy Corridor
    '77546', '77573', '77584'             // Pearland / Friendswood / League City
  ]);

  const form = document.getElementById('booking-form');
  const submitBtn = document.getElementById('submit-btn');
  const statusBox = document.getElementById('status');

  function setError(field, message) {
    document.getElementById(`err-${field}`).textContent = message || '';
  }

  function clearErrors() {
    ['name', 'vehicle', 'zip', 'service', 'time_slot'].forEach(f => setError(f, ''));
  }

  function showStatus(kind, message) {
    statusBox.className = `status show ${kind}`;
    statusBox.textContent = message;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();
    statusBox.className = 'status';

    const data = Object.fromEntries(new FormData(form).entries());
    let hasError = false;

    if (!data.name || data.name.trim().length < 2) {
      setError('name', 'Enter your full name.');
      hasError = true;
    }
    if (!data.vehicle || data.vehicle.trim().length < 2) {
      setError('vehicle', 'Tell us the make, model, and color.');
      hasError = true;
    }
    if (!/^\d{5}$/.test(data.zip || '')) {
      setError('zip', 'Enter a 5-digit zip code.');
      hasError = true;
    } else if (!SERVICE_ZIPS.has(data.zip)) {
      setError('zip', "We don't service this zip yet — check the areas listed below.");
      hasError = true;
    }
    if (!data.service) {
      setError('service', 'Choose a service.');
      hasError = true;
    }
    if (!data.time_slot) {
      setError('time_slot', 'Choose a time slot.');
      hasError = true;
    }

    if (hasError) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Booking…';

    try {
      const { error } = await supabase.from('bookings').insert({
        name: data.name.trim(),
        vehicle: data.vehicle.trim(),
        zip: data.zip,
        service: data.service,
        time_slot: data.time_slot
      });

      if (error) throw error;

      showStatus('ok', `Thanks, ${data.name.split(' ')[0]} — you're booked for ${data.time_slot} (${data.service}). We'll text you to confirm.`);
      form.reset();
    } catch (err) {
      console.error(err);
      showStatus('err', 'Something went wrong submitting your booking. Please try again in a moment.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Request booking';
    }
  });
</script>

</body>
</html>
